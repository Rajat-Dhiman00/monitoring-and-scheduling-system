name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Create build directory
      run: mkdir build
    - name: Configure with CMake
      run: cd build && cmake ..
    - name: Build
      run: cd build && make
    - name: Run tests
      run: cd build && make test
